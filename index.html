<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Qual carro esportivo combina com você?</title>
</head>

<body>

    <main class="caixa-principal">

        <div class="icone">🏎️</div>

        <h1>QUAL CARRO COMBINA COM VOCÊ?</h1>

        <p class="subtitulo">
            Responda às perguntas e descubra qual estilo de carro esportivo combina com sua personalidade.
        </p>

        <div class="barra-progresso">
            <div class="progresso"></div>
        </div>

        <div class="numero-pergunta"></div>

        <div class="caixa-perguntas"></div>

        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <span class="resultado-titulo">SEU RESULTADO</span>
            <p class="texto-resultado"></p>

            <button class="botao-reiniciar" onclick="reiniciarQuiz()">
                🔄 FAZER NOVAMENTE
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
